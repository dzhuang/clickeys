<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' file:; connect-src 'self' file:;">
    <title>Clickeys - 打字音效</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-drag">
                <span class="app-title">⌨️ Clickeys</span>
            </div>
            <div class="title-bar-buttons">
                <button class="title-btn minimize-btn" id="minimizeBtn">─</button>
                <button class="title-btn close-btn" id="closeBtn">✕</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Toggles Group -->
            <div class="card">
                <h3 class="card-title">🎛️ 音效开关</h3>
                <div class="toggle-group">
                    <div class="enable-row">
                        <div class="enable-info">
                            <span class="enable-label">⌨️ 键盘音效</span>
                            <span class="enable-shortcut">Ctrl+Shift+5</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="keyboardToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="enable-row">
                        <div class="enable-info">
                            <span class="enable-label">🖱️ 鼠标音效</span>
                            <span class="enable-shortcut">Ctrl+Shift+6</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="mouseToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Ignore Keys -->
            <div class="card">
                <h3 class="card-title">🛑 忽略按键</h3>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="ignoreShift"> 忽略 Shift
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="ignoreCtrl"> 忽略 Ctrl
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="ignoreAlt"> 忽略 Alt
                    </label>
                </div>
            </div>

            <!-- Sound Scheme -->
            <div class="card">
                <h3 class="card-title">🎵 音效方案</h3>
                <div class="scheme-grid" id="schemeGrid">
                    <!-- Scheme cards will be generated by JavaScript -->
                </div>
            </div>

            <!-- Volume & Pitch -->
            <div class="card">
                <h3 class="card-title">🔊 音量与音调</h3>
                <div class="slider-group">
                    <div class="slider-row">
                        <label class="slider-label">键盘音量</label>
                        <input type="range" class="slider" id="volumeSlider" min="0" max="100" value="80">
                        <span class="slider-value" id="volumeValue">80%</span>
                    </div>
                    <div class="slider-row">
                        <label class="slider-label">鼠标音量</label>
                        <input type="range" class="slider" id="mouseVolumeSlider" min="0" max="100" value="80">
                        <span class="slider-value" id="mouseVolumeValue">80%</span>
                    </div>
                    <div class="slider-row">
                        <label class="slider-label">音调</label>
                        <input type="range" class="slider" id="pitchSlider" min="50" max="150" value="100">
                        <span class="slider-value" id="pitchValue">1.0x</span>
                    </div>
                </div>
            </div>

            <!-- Volume & Pitch -->
            <!-- ... sliders ... -->

            <!-- Mouse Scheme Selector (New) -->
            <div class="card">
                <h3 class="card-title">🖱️ 鼠标型号</h3>
                <select class="device-select" id="mouseSchemeSelect">
                    <!-- Populated by JS -->
                </select>
            </div>

            <!-- Audio Output Device -->
            <div class="card">
                <h3 class="card-title">🎧 音频输出设备</h3>
                <p class="card-description">选择 VB-Cable 可将打字音效路由到虚拟音频设备</p>

                <div class="slider-group">
                    <div class="device-row">
                        <label class="slider-label"
                            style="width: auto; margin-bottom: 5px; display: block;">键盘输出</label>
                        <select class="device-select" id="keyboardDeviceSelect">
                            <option value="default">默认设备</option>
                        </select>
                    </div>

                    <div class="device-row">
                        <label class="slider-label"
                            style="width: auto; margin-bottom: 5px; display: block;">鼠标输出</label>
                        <select class="device-select" id="mouseDeviceSelect">
                            <option value="default">默认设备</option>
                        </select>
                    </div>
                </div>

                <button class="refresh-btn" id="refreshDevicesBtn">🔄 刷新设备列表</button>
            </div>

            <!-- Test Sound -->
            <div class="card">
                <button class="test-btn" id="testSoundBtn">🔔 测试音效</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Clickeys v1.0.1 | 按 Ctrl+Shift+7 唤出此窗口</span>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
